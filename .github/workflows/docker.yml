name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "scripts/**"
      - "**/testdata/**"
      - "**/*_test.go"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

# One self-hosted runner takes these jobs one at a time, so a superseded run
# would sit in the queue ahead of the push that replaced it. Pushes to main and
# tags are never cancelled -- those publish images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Both jobs run on the self-hosted runner by default. Set the CI_RUNNER_LABELS
# repository variable to a JSON array to move them without editing this file:
# ["ubuntu-latest"] puts CI back on GitHub's runners while the homelab machine
# is down, and unsetting it brings CI home again.
#
# A self-hosted runner needs Docker with buildx usable by the runner user, and
# passwordless sudo for the apt steps below (see the runner-smoke workflow,
# which checks the Docker half).
jobs:
  test:
    if: github.event_name == 'pull_request'
    # A fork's pull request must never land on the self-hosted runner: the job
    # would execute that fork's code on a machine inside a private network,
    # which is the hazard GitHub warns about for self-hosted runners. Fork PRs
    # go to a throwaway hosted runner instead, where this workflow already
    # degrades to unit tests because the private suite's key is withheld.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # The e2e suites and the verification stack live in a private repository
      # overlaid at dev/. GitHub withholds secrets from fork pull
      # requests, so this job has to detect that and degrade loudly rather than
      # report a green run that never executed e2e. secrets.* is not available
      # in a job-level `if`, which is why the guard is a step.
      - name: Detect private suite access
        id: access
        env:
          KEY: ${{ secrets.DEV_REPO_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out private dev suite
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          repository: lemmary/lemmary-dev
          ssh-key: ${{ secrets.DEV_REPO_KEY }}
          path: dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        # A self-hosted runner keeps whatever the last run installed, so only
        # reach for apt (and the sudo it needs) when poppler is actually
        # missing. pdftoppm is what the preview step shells out to.
        run: |
          if command -v pdftoppm >/dev/null 2>&1; then
            echo "poppler-utils already present: $(pdftoppm -v 2>&1 | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dev suite dependencies
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        # --with-deps unconditionally: the browser download is cached on a
        # persistent runner, and only the apt half repeats. Skipping it there
        # would mean chromium's system libraries had to be provisioned by hand,
        # which is a worse trade than a few seconds of a satisfied apt run.
        run: npx playwright install --with-deps chromium

      - name: Run verification suite
        if: steps.access.outputs.ok == 'true'
        run: ./dev/scripts/test-all.sh

      - name: Run unit tests only (private suite unavailable)
        if: steps.access.outputs.ok != 'true'
        run: |
          echo "::warning::e2e suites skipped - the private dev repository is not reachable from a fork pull request. Unit tests and the compile-level extension-seam check ran; API and browser e2e did not."
          cd backend
          go test ./... -count=1
          go vet -tags lemmary_exttest ./...
          go test -tags lemmary_exttest ./internal/boot/ -count=1
          cd ../frontend
          npm test
          # The full path builds the SPA inside test-all.sh stage 5. Without it
          # nothing on a pull request compiles the frontend at all -- the build
          # job is push-only -- so a fork PR could go green with tsc, Vite or
          # VitePress broken.
          npm run build

  build:
    if: github.event_name != 'pull_request'
    # Only runs on push, tag and manual dispatch from this repository, so there
    # is no untrusted code to keep off the runner.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Lemmary
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
