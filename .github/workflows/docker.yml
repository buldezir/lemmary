name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "**/testdata/**"
      - "**/*_test.go"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

# One self-hosted runner takes these jobs one at a time, so a superseded run
# would sit in the queue ahead of the push that replaced it. Pushes to main and
# tags are never cancelled -- those publish the images everything else pulls.
# A superseded pull request build is cancelled with the rest of its run: its
# image is a preview of a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Both jobs run on the self-hosted runner by default. Set the CI_RUNNER_LABELS
# repository variable to a JSON array to move them without editing this file:
# ["ubuntu-latest"] puts CI back on GitHub's runners while the homelab machine
# is down, and unsetting it brings CI home again.
#
# A self-hosted runner needs Docker with buildx usable by the runner user
# (see the runner-smoke workflow). The test job runs verification inside
# Docker; it does not install Go, Node, Playwright or poppler on the host.
jobs:
  test:
    if: github.event_name == 'pull_request'
    # A fork's pull request must never land on the self-hosted runner: the job
    # would execute that fork's code on a machine inside a private network,
    # which is the hazard GitHub warns about for self-hosted runners. Fork PRs
    # go to a throwaway hosted runner instead. The private overlay's key is
    # withheld there, so ./scripts/test-all.sh fails rather than reporting a
    # green run that never executed e2e.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # The e2e suites and the verification stack live in a private repository
      # overlaid at dev/. GitHub withholds secrets from fork pull
      # requests, so this job has to detect that: without the overlay,
      # ./scripts/test-all.sh fails. secrets.* is not available in a job-level
      # `if`, which is why the guard is a step.
      - name: Detect private suite access
        id: access
        env:
          KEY: ${{ secrets.DEV_REPO_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out private dev suite
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          repository: lemmary/lemmary-dev
          ssh-key: ${{ secrets.DEV_REPO_KEY }}
          path: dev

      # A change that spans both repositories is two commits on two branches of
      # the same name. Checking the overlay out at main would run this pull
      # request's code against e2e suites that know nothing about it: a behaviour
      # change would fail against the old assertions, and a new feature would go
      # green with no coverage at all. So prefer the matching branch when the
      # overlay has one, and fall back to main, which is what a pull request that
      # touches only this repository needs.
      #
      # Done after the checkout rather than through its `ref` input because that
      # would need the branch resolved before any credential exists. The checkout
      # leaves the deploy key configured in dev/.git/config, so ls-remote and
      # fetch below reuse it.
      - name: Prefer the matching dev branch
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        env:
          # head_ref is the source branch of a pull request; ref_name covers a
          # push or manual dispatch, should this job ever run on one. For a pull
          # request ref_name is "<number>/merge", which no overlay branch is
          # named, so the order matters.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Diagnostic only, so it must never be the thing that fails this step.
          show() { git log -1 --format='dev/ at %h %s' 2>/dev/null || true; }

          fallback() {
            echo "::notice::Verification suite: lemmary-dev@main ($1)"
            show
            exit 0
          }

          if [ -z "${BRANCH:-}" ]; then
            fallback "no branch name to match"
          fi
          if [ "$BRANCH" = "main" ]; then
            fallback "already on main"
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            fallback "no branch named $BRANCH"
          fi

          # Shallow: the suites are run, not bisected.
          git fetch --depth=1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --force -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          echo "::notice::Verification suite: lemmary-dev@$BRANCH"
          show

      - name: Run verification suite
        # The wrapper resolves the overlay (checked out at dev/ above, since
        # actions/checkout cannot place a repository outside the workspace) and
        # delegates to it. Running the same entry point developers run is the
        # point: a wrapper that only CI or only humans exercise rots. No overlay
        # is a failure.
        run: ./scripts/test-all.sh

  build:
    # Never publish an image for a red pull request: the tag moves with the
    # branch, so pushing one for a failed run would leave whoever pulls it
    # running code the suite rejected, with nothing in the tag to say so.
    needs: test
    # `always()` so this is evaluated at all when `test` did not succeed --
    # without it a failed dependency skips the job silently instead of on the
    # terms below. A push or tag skips `test` outright (it is pull-request
    # only), and a skipped dependency must not block the release build, hence
    # accepting "skipped" alongside "success".
    #
    # A fork's pull request never builds either. The job holds a package-write
    # token and runs on the self-hosted runner, and a fork's code must have
    # neither; skipping is the only safe answer, since there is no fork
    # equivalent of the test job's throwaway-runner fallback once GHCR push is
    # involved.
    if: >-
      always()
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Otherwise only push, tag and manual dispatch from this repository, so
    # there is no untrusted code to keep off the runner.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch name may contain characters a Docker tag may not -- "/" above
      # all, which every feat/… branch has. metadata-action sanitizes the refs
      # it derives itself, but not a type=raw value, so the branch tag is
      # sanitized here instead: anything outside the tag alphabet becomes "-".
      - name: Tag name for this pull request
        if: github.event_name == 'pull_request'
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9_.-' '-')
          # A tag may not open with a separator, and is capped at 128 chars.
          tag=$(printf '%s' "$tag" | sed 's/^[^A-Za-z0-9_]*//' | cut -c1-128)
          if [ -z "$tag" ]; then
            echo "::error::Could not derive a Docker tag from branch '$HEAD_REF'"
            exit 1
          fi

          # A pull request must not be able to publish over a release tag. The
          # branch name is the whole tag, this job holds packages:write, and it
          # runs before any review -- so a branch called `latest` would replace
          # the image docker-compose.yml and the self-hosting guide tell people
          # to pull, and one called `1.2` would replace a release line. Refused
          # rather than silently prefixed: the branch is trivially renamed, and
          # a tag that did not match its branch would be its own surprise.
          case "$tag" in
            latest | main | edge)
              echo "::error::Branch '$HEAD_REF' would publish over the release tag '$tag'. Rename the branch."
              exit 1
              ;;
          esac
          if printf '%s' "$tag" | grep -Eq '^v?[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Branch '$HEAD_REF' looks like a release version. Rename the branch."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Pull request image tag: $tag"

      # A pull request gets exactly one tag, the source branch name, so a
      # reviewer can pull the branch and run it. Deliberately not the sha, the
      # semver or `latest`: those name releases, and a tag that moves with the
      # branch means "whatever this PR currently is", which is what someone
      # testing a PR actually wants. type=ref,event=pr would tag it `pr-<n>`,
      # naming the review rather than the thing under review.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Lemmary
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
