name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "scripts/**"
      - "**/testdata/**"
      - "**/*_test.go"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # The e2e suites and the verification stack live in a private repository
      # overlaid at backend/dev/. GitHub withholds secrets from fork pull
      # requests, so this job has to detect that and degrade loudly rather than
      # report a green run that never executed e2e. secrets.* is not available
      # in a job-level `if`, which is why the guard is a step.
      - name: Detect private suite access
        id: access
        env:
          KEY: ${{ secrets.DEV_REPO_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out private dev suite
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          repository: lemmary/lemmary-dev
          ssh-key: ${{ secrets.DEV_REPO_KEY }}
          path: backend/dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install dev suite dependencies
        if: steps.access.outputs.ok == 'true'
        working-directory: backend/dev
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.access.outputs.ok == 'true'
        working-directory: backend/dev
        run: npx playwright install --with-deps chromium

      - name: Run verification suite
        if: steps.access.outputs.ok == 'true'
        run: ./backend/dev/scripts/test-all.sh

      - name: Run unit tests only (private suite unavailable)
        if: steps.access.outputs.ok != 'true'
        run: |
          echo "::warning::e2e suites skipped - the private dev repository is not reachable from a fork pull request. Unit tests and the compile-level extension-seam check ran; API and browser e2e did not."
          cd backend
          go test $(go list ./... | grep -v '/e2e$') -count=1
          go vet -tags lemmary_exttest ./...
          go test -tags lemmary_exttest ./internal/boot/ -count=1
          cd ../frontend
          npm test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Lemmary
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
