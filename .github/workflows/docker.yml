name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "**/testdata/**"
      - "**/*_test.go"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "!docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

# One self-hosted runner takes these jobs one at a time, so a superseded run
# would sit in the queue ahead of the push that replaced it. Pushes to main and
# tags are never cancelled -- those publish images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Both jobs run on the self-hosted runner by default. Set the CI_RUNNER_LABELS
# repository variable to a JSON array to move them without editing this file:
# ["ubuntu-latest"] puts CI back on GitHub's runners while the homelab machine
# is down, and unsetting it brings CI home again.
#
# A self-hosted runner needs Docker with buildx usable by the runner user, and
# passwordless sudo for the apt steps below (see the runner-smoke workflow,
# which checks the Docker half).
jobs:
  test:
    if: github.event_name == 'pull_request'
    # A fork's pull request must never land on the self-hosted runner: the job
    # would execute that fork's code on a machine inside a private network,
    # which is the hazard GitHub warns about for self-hosted runners. Fork PRs
    # go to a throwaway hosted runner instead, where this workflow already
    # degrades to unit tests because the private suite's key is withheld.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # The e2e suites and the verification stack live in a private repository
      # overlaid at dev/. GitHub withholds secrets from fork pull
      # requests, so this job has to detect that and degrade loudly rather than
      # report a green run that never executed e2e. secrets.* is not available
      # in a job-level `if`, which is why the guard is a step.
      - name: Detect private suite access
        id: access
        env:
          KEY: ${{ secrets.DEV_REPO_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out private dev suite
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v6
        with:
          repository: lemmary/lemmary-dev
          ssh-key: ${{ secrets.DEV_REPO_KEY }}
          path: dev

      # A change that spans both repositories is two commits on two branches of
      # the same name. Checking the overlay out at main would run this pull
      # request's code against e2e suites that know nothing about it: a behaviour
      # change would fail against the old assertions, and a new feature would go
      # green with no coverage at all. So prefer the matching branch when the
      # overlay has one, and fall back to main, which is what a pull request that
      # touches only this repository needs.
      #
      # Done after the checkout rather than through its `ref` input because that
      # would need the branch resolved before any credential exists. The checkout
      # leaves the deploy key configured in dev/.git/config, so ls-remote and
      # fetch below reuse it.
      - name: Prefer the matching dev branch
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        env:
          # head_ref is the source branch of a pull request; ref_name covers a
          # push or manual dispatch, should this job ever run on one. For a pull
          # request ref_name is "<number>/merge", which no overlay branch is
          # named, so the order matters.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Diagnostic only, so it must never be the thing that fails this step.
          show() { git log -1 --format='dev/ at %h %s' 2>/dev/null || true; }

          fallback() {
            echo "::notice::Verification suite: lemmary-dev@main ($1)"
            show
            exit 0
          }

          if [ -z "${BRANCH:-}" ]; then
            fallback "no branch name to match"
          fi
          if [ "$BRANCH" = "main" ]; then
            fallback "already on main"
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            fallback "no branch named $BRANCH"
          fi

          # Shallow: the suites are run, not bisected.
          git fetch --depth=1 origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout --force -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          echo "::notice::Verification suite: lemmary-dev@$BRANCH"
          show

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # There is no package.json at the repository root for the action to
          # read a packageManager field from, so the version is explicit here.
          # Keep it in step with frontend/package.json and the Dockerfile.
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          # Must come after pnpm is installed: this step primes pnpm's store
          # cache and needs the binary to locate it.
          cache: pnpm
          # Only the frontend lockfile. A fork pull request gets no dev/, and a
          # cache path that matches nothing fails this step -- while the dev
          # suite's single dependency is not worth caching anyway.
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install system dependencies
        # A self-hosted runner keeps whatever the last run installed, so only
        # reach for apt (and the sudo it needs) when poppler is actually
        # missing. pdftoppm is what the preview step shells out to.
        run: |
          if command -v pdftoppm >/dev/null 2>&1; then
            echo "poppler-utils already present: $(pdftoppm -v 2>&1 | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y poppler-utils
          fi

      # bleve's vector search is a cgo binding to blevesearch's FAISS fork, and
      # every go command in this repository carries -tags vectors, so nothing
      # compiles without it. faiss-build.sh owns the pinned commit and records
      # it in $PREFIX/lib/faiss.ref; the self-hosted runner keeps that install
      # between runs, so the usual outcome here is one grep and no build.
      - name: Restore FAISS cache
        # Only for the hosted fallback runner, which starts empty every time.
        # The self-hosted machine keeps /usr/local/lib/faiss.ref between runs
        # and skips the whole thing a step later.
        if: runner.environment == 'github-hosted'
        id: faiss-cache
        uses: actions/cache@v4
        with:
          path: /opt/faiss
          key: faiss-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/faiss-build.sh') }}

      - name: Install FAISS (bleve vectors)
        run: |
          set -euo pipefail
          pin="$(grep -oP '^FAISS_REF="\K[0-9a-f]+' scripts/faiss-build.sh)"
          if [ -f /usr/local/lib/faiss.ref ] && [ "$(cat /usr/local/lib/faiss.ref)" = "$pin" ]; then
            echo "FAISS $pin already installed"
            exit 0
          fi
          sudo apt-get update
          # A hosted runner starts empty every time; the cache above, when it
          # hits, turns this into a copy instead of a five-minute compile.
          if [ ! -f /opt/faiss/lib/faiss.ref ] || [ "$(cat /opt/faiss/lib/faiss.ref)" != "$pin" ]; then
            sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libopenblas-dev
            sudo ./scripts/faiss-build.sh --prefix /opt/faiss
            sudo chown -R "$(id -u):$(id -g)" /opt/faiss
          fi
          sudo cp -a /opt/faiss/lib/. /usr/local/lib/
          sudo cp -a /opt/faiss/include/. /usr/local/include/
          sudo ldconfig
          # OpenBLAS and libgomp are what libfaiss.so itself was linked against,
          # so they have to be here to link the backend and to run it. The -dev
          # package covers a runner that built FAISS; this covers one that only
          # restored the cache.
          sudo apt-get install -y --no-install-recommends libopenblas0-pthread libgomp1

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install dev suite dependencies
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.access.outputs.ok == 'true'
        working-directory: dev
        # --with-deps unconditionally: the browser download is cached on a
        # persistent runner, and only the apt half repeats. Skipping it there
        # would mean chromium's system libraries had to be provisioned by hand,
        # which is a worse trade than a few seconds of a satisfied apt run.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run verification suite
        if: steps.access.outputs.ok == 'true'
        # The wrapper resolves the overlay (checked out at dev/ above, since
        # actions/checkout cannot place a repository outside the workspace) and
        # delegates to it. Running the same entry point developers run is the
        # point: a wrapper that only CI or only humans exercise rots.
        run: ./scripts/test-all.sh

      - name: Run unit tests only (private suite unavailable)
        if: steps.access.outputs.ok != 'true'
        run: |
          echo "::warning::e2e suites skipped - the private dev repository is not reachable from a fork pull request. Go unit tests, go vet, frontend tests and the SPA build ran; API and browser e2e did not."
          # Finding no overlay, the wrapper runs the reduced set by itself:
          # Go unit tests, go vet, frontend tests, and the SPA build. That
          # build matters -- the build job is push-only, so without it a fork
          # pull request compiles the frontend nowhere and could go green with
          # tsc, Vite or VitePress broken.
          ./scripts/test-all.sh

  build:
    if: github.event_name != 'pull_request'
    # Only runs on push, tag and manual dispatch from this repository, so there
    # is no untrusted code to keep off the runner.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted", "linux", "x64", "homelab"]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Lemmary
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
