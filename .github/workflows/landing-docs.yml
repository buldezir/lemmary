name: Landing docs

# lemmary.app builds its docs from this repo's main, so a docs change rebuilds
# that site. LANDING_DISPATCH_TOKEN is a fine-grained token scoped to
# lemmary/lemmary-landing with Actions: read and write.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "frontend/.vitepress/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run docker.yml --repo lemmary/lemmary-landing --ref main
        env:
          GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
