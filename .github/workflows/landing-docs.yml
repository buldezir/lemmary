name: Landing docs

# lemmary.app builds its docs from this repo's main, so a docs change rebuilds
# that site. LANDING_DEPLOY_HOOK is the Workers Builds deploy hook URL for the
# lemmary-landing Worker's main branch.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "frontend/.vitepress/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail-with-body -sS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
