name: Feature or change
description: A spec precise enough to hand to a coding agent as its prompt.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Only maintainers open pull requests; a clear spec is the contribution. See [CONTRIBUTING.md](https://github.com/buldezir/lemmary/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What you're trying to do, and why. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: What happens today and what should happen instead. Name screens, settings or API calls exactly; labels, defaults, what an admin and a regular user see. Files or endpoints involved, if you know them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Steps a person could follow to check it's done, and what they'd see at the end. Edge cases (empty states, large inputs, other languages, file types, providers, documents created before the change) and what this should not change.
    validations:
      required: true
