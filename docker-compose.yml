services:
  app:
    image: ghcr.io/buldezir/lemmary:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8090:${PORT:-80}"
    volumes:
      - app_data:/app/pb_data
      # Consume folder: uncomment together with INGEST_DIR=/consume in .env.
      # - ./consume:/consume

volumes:
  app_data:
